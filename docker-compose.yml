services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: lexbot
      POSTGRES_PASSWORD: lexbot
      POSTGRES_DB: lexbot
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexbot -d lexbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ChromaDB persistence shared with the host (ingest CLI default ./data/chroma)
      - ./data/chroma:/app/data/chroma
    env_file:
      # Forward embedding credentials (EMBEDDING_PROVIDER / GEMINI_API_KEY /
      # OPENAI_API_KEY) from .env into the container. .env is gitignored;
      # .env.example documents the vars. required: false keeps compose working
      # on hosts with no .env (fresh clone / CI). Explicit environment: entries
      # below override env_file values (e.g. DATABASE_URL stays db:5432).
      - path: .env
        required: false
    environment:
      # From .env when present (compose auto-loads it); fallbacks match the
      # code defaults in agent/src/lexbot_agent/{llm,tools}.py
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-lite}
      # Container network: the db service host, NOT host localhost. Not
      # interpolated on purpose — a localhost URL can never reach PG from here.
      DATABASE_URL: postgresql://lexbot:lexbot@db:5432/lexbot
      # Telegram channel (TG-3): direct Bot API, no bridge service. Empty =
      # stub mode — the stack still boots (unset token → inbound webhook
      # acknowledges but never processes; unset secret → every update 401,
      # fail closed).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}

volumes:
  db-data:
