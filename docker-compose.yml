services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: lexbot
      POSTGRES_PASSWORD: lexbot
      POSTGRES_DB: lexbot
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexbot -d lexbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ChromaDB persistence shared with the host (ingest CLI default ./data/chroma)
      - ./data/chroma:/app/data/chroma
    env_file:
      # Forward embedding credentials (EMBEDDING_PROVIDER / GEMINI_API_KEY /
      # OPENAI_API_KEY) from .env into the container. .env is gitignored;
      # .env.example documents the vars. required: false keeps compose working
      # on hosts with no .env (fresh clone / CI). Explicit environment: entries
      # below override env_file values (e.g. DATABASE_URL stays db:5432).
      - path: .env
        required: false
    environment:
      # From .env when present (compose auto-loads it); fallbacks match the
      # code defaults in agent/src/lexbot_agent/{llm,tools}.py
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
      # Container network: the db service host, NOT host localhost. Not
      # interpolated on purpose — a localhost URL can never reach PG from here.
      DATABASE_URL: postgresql://lexbot:lexbot@db:5432/lexbot
      # Empty = notify_whatsapp stub mode (D7); set to a real n8n webhook URL
      # to enable the httpx POST path.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}

  # n8n: pure WhatsApp bridge between the agent/API contracts and the Meta
  # WhatsApp Cloud API. Standalone by design — no depends_on on db/api: the
  # inbound workflow reaches the api over the compose network at http://api:8000.
  n8n:
    image: n8nio/n8n:2.35.7
    ports:
      # Host 5679 → container 5678: keeps 5678 free for n8n-ops-hub.
      - "5679:5678"
    env_file:
      # Same pattern as api: forward WHATSAPP_* from .env into the container.
      # required: false keeps compose working without .env (fresh clone / CI).
      # NOTE: N8N_WEBHOOK_URL is deliberately NOT forwarded here — it is also
      # an n8n-native env var (webhook base URL behind a reverse proxy) and
      # would corrupt n8n's webhook URLs when set. The agent's outbound URL is
      # consumed only by the api service above.
      - path: .env
        required: false
    environment:
      # n8n >= 2.x blocks $env access inside workflow expressions by default
      # (N8N_BLOCK_ENV_ACCESS_IN_NODE unset = blocked). The bridge workflows
      # read Meta credentials ONLY via {{ $env.WHATSAPP_* }} (WB-5), so env
      # access must be explicitly allowed.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      # n8n instance data (workflows, credentials metadata) persists across restarts.
      - n8n_data:/home/node/.n8n
      # Read-only import dir: `docker compose exec n8n n8n import:workflow --input=/home/node/workflows/*.json`
      - ./n8n:/home/node/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db-data:
  n8n_data:
